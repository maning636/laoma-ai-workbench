[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-publisher"
version = "0.1.0"
description = "老马AI工作台：跨平台内容编排与发布"
readme = "README.md"
# Python 版本支持矩阵（详见 STARTUP.md § "Python 版本支持矩阵"）：
#   - 最低支持版本: 3.11（与 CI + 生产 OpenCloudOS 9.6 对齐；生产实测跑通 cloud_service）
#   - 上限: 不限（本地开发 prismenv 用 3.13.14 已验证可用；不设 <3.13 上限以避免
#     开发环境的 pip 严格模式拒绝安装依赖）
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "aiohttp-cors>=0.7",
  "celery>=5.4,<5.5",
  "fastapi>=0.115",
  "httpx>=0.28",
  "httpx-sse>=0.4",
  "loguru>=0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.59.1",
  "pydantic-settings>=2.7",
  "python-multipart>=0.0.18",
  "python-dotenv>=1.0.1",
  "pytz>=2024.2",
  "qrcode[pil]>=8.0",
  # redis-py>=5 走 RESP3（发 HELLO 3），与内置 Redis 5.0.14 不兼容，故固定 <5，与 requirements.txt 对齐
  "redis<5",
  "requests>=2.32.3",
  "segno>=1.6.6",
  "sqlalchemy>=2.0.52",
  "sse-starlette>=2.2",
  "toml>=0.10.2",
  "uvicorn[standard]>=0.32",
  "gmssl>=3.2.2",
  "websockets>=16.1.1",
  "openai>=3.14.0",
  "aiofiles>=25.1.0",
  "psutil>=7.2.2",
  "pyyaml>=6.0.3",
  "biliup>=1.2.4",
  "xhs>=0.2.13",
  "browser-cookie3>=0.20.1",
  "selenium>=4.49.0",
  "imageio-ffmpeg>=0.6.0",
  "pyfiglet>=1.0.4",
  "pywebio>=1.8.4",
  "pywebio-battery>=0.7.0",
  "rich>=15.0.0",
  "schedule>=1.2.2",
  "tenacity>=9.1.4",
  "openpyxl>=3.1.5",
  "importlib-resources>=7.1.0",
  "json-repair>=0.63.4",
]

[project.scripts]
prism = "prism_cli:main"

[tool.setuptools]
py-modules = ["prism_cli"]

[tool.vercel]
entrypoint = "prism_backend.fastapi_app.main:app"
