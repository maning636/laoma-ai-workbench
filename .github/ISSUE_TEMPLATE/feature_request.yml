name: 💡 功能请求
description: 建议新功能、改进或 Open Core 边界讨论
title: "[Feat] <一句话描述>"
labels: ["enhancement", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！请先搜索现有 Issue / [LINUX DO](https://linux.do/) 讨论区，避免重复。
        涉及 Pro 云端（prompt / key / 数据服务）的请求请明确标注，方便我们判断是否走 Community 路线。

  - type: textarea
    id: problem
    attributes:
      label: 场景 / 问题
      description: 这个功能解决什么问题？谁在使用？
      placeholder: |
        我在多平台发布视频时，每次都要手动复制粘贴 AI 生成的标题到小红书 / 抖音，
        希望能一键同步到矩阵账号的定时计划里。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望这个功能长什么样？请描述用户视角的交互流程
      placeholder: |
        在 M1 文生图结果页新增"一键排期"按钮，选中平台+账号后自动生成矩阵任务并加入定时队列。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / 现有做法
      description: 目前是否用其他方式绕过？或者你觉得哪些现有功能可以扩展
      placeholder: 目前只能通过 API 手写 curl 实现，不够好用

  - type: dropdown
    id: module
    attributes:
      label: 涉及的模块
      multiple: true
      options:
        - M1 文生图
        - M2 智能体
        - M3 积分
        - M4 工作流
        - M5 图片编辑器
        - 账号 / 登录
        - 平台适配器（抖音 / 小红书 / B 站 / TikTok / YouTube / 其他）
        - Persona / 浏览器运行时
        - 代理 / IP 池
        - 开发者工具中心（/tools）
        - 前端 UI
        - 后端 API
        - Electron 桌面端
        - Cloud Service
        - 其他
    validations:
      required: true

  - type: dropdown
    id: edition
    attributes:
      label: 建议归属
      description: |
        - **Community**：可以完全开源实现，无云端依赖
        - **Pro**：需要官方云端的 prompt / key / 数据 / Hermes Agent 官方运行时
        - **混合**：基础能力开源，云端能力付费
        - 不确定：请描述后由维护者判断
      options:
        - Community（开源免费）
        - Pro（付费云端）
        - 混合
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 额外说明
      description: 参考资料、竞品对比、设计草图、预期影响面
      placeholder: |
        参考：https://github.com/xxx/yyy
        影响用户：所有多平台运营者

  - type: checkboxes
    id: willingness
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能（会读 [CONTRIBUTING.md](../../CONTRIBUTING.md)）
        - label: 我可以提供设计稿 / 原型 / 测试用例
        - label: 我仅提供需求，实现交给维护者
