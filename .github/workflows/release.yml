# ============================================================
# 老马AI工作台桌面版发布流水线：打包 Windows / macOS 并发布到 GitHub Releases
#
# 更新通道（**客户端自动更新**）：electron-updater **generic** provider
#   - 见 desktop-electron/package.json build.publish → https://maning789link.top/downloads
#   - 客户端自动更新查自建通道的 latest.yml，**不查 GitHub**；
#   - 2026-10-23 马哥在《开源发布收尾 · 待决表》P3 选 A：暂留 generic 自建通道，本版不动
#     （切 GitHub provider 对国内用户是净退化 —— 自动更新走 GitHub 直连 0.12 MB/s，
#      639 MB 约 89 分钟）。
#
# 本 workflow 自己发布到 **GitHub Releases**（ncipollo/release-action）：
#   - 资产：latest.yml / latest-mac.yml + 安装包 + blockmap，挂在 tag 上；
#   - 历史版本下载：https://github.com/<owner>/<repo>/releases/download/<tag>/
#   注意：这条是「人下安装包」的通道，与上面的「客户端自动更新」是两条独立链路。
#
# 版本一致性（自动处理）：
#   - push tag v<版本>：workflow 自动把 desktop-electron/package.json 的 version 同步为 <版本>
#   - 手动触发：填 version 输入则同步；留空则用 package.json 现有版本
#   - 资产名（LaomaAI-<version>-setup.exe）与 tag 保持一致
#
# macOS 签名（默认 unsigned，Gatekeeper 会拦截，需右键打开）：
#   正式分发时配置 GitHub Secrets 后 electron-builder 自动签名/公证：
#     CSC_LINK（证书 .p12 的 base64）、CSC_KEY_PASSWORD
#     公证：APPLE_ID、APPLE_APP_SPECIFIC_PASSWORD、APPLE_TEAM_ID
# ============================================================

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v，如 1.2.0；留空则用 package.json version）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: prism-release-${{ github.ref }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NEXT_TELEMETRY_DISABLED: '1'
  # tag 触发: v1.2.0 → 1.2.0；手动触发: 用输入版本
  LAOMA_VERSION: ${{ (github.ref_type == 'tag' && github.ref_name) || inputs.version }}

jobs:
  check:
    name: 检查 Release 是否已存在
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.decide.outputs.should_build }}
    steps:
      # tag 已被手工发布过（资产已验收）时不再重复打包，避免 CI 用未验收产物覆盖已发布资产
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$TAG" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists - skip rebuild."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    name: Windows x64 (NSIS)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步版本号 (与 tag/输入一致)
        shell: bash
        run: |
          if [ -n "${LAOMA_VERSION}" ]; then
            VERSION="${LAOMA_VERSION#v}"
            node -e "const fs=require('fs');const p='desktop-electron/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n','utf8')"
            echo "✅ version 同步为 ${VERSION}"
          else
            echo "⚠️ 手动触发未填版本，使用 package.json 现有版本"
          fi
          node -p "require('./desktop-electron/package.json').version"

      - name: 解析云端地址 (注入 NEXT_PUBLIC_CLOUD_URL)
        shell: bash
        run: |
          set -euo pipefail
          # 单一真值：desktop-electron/package.json 的 laomaCloudUrl（云端根地址，不含 /cloud 后缀）
          # 与本地打包脚本 scripts/packaging/resolve_cloud_url.ps1 读同一个字段，两边不会漂移。
          CLOUD_URL=$(node -p "require('./desktop-electron/package.json').laomaCloudUrl")
          if [ -z "$CLOUD_URL" ]; then
            echo "::error::desktop-electron/package.json 缺少 laomaCloudUrl，无法构建前端"
            exit 1
          fi
          echo "laomaCloudUrl = ${CLOUD_URL}"
          echo "NEXT_PUBLIC_CLOUD_URL=${CLOUD_URL}" >> "$GITHUB_ENV"

      - name: 构建前端 (Next.js standalone)
        working-directory: prism_frontend
        run: |
          npm ci
          npm run build

      - name: 构建 prismenv (Python 运行时)
        run: |
          python -m venv prismenv
          prismenv/Scripts/python.exe -m pip install --upgrade pip
          prismenv/Scripts/python.exe -m pip install -r requirements.txt

      - name: 构建 supervisor.exe (PyInstaller)
        run: |
          prismenv/Scripts/python.exe -m pip install pyinstaller
          prismenv/Scripts/python.exe -m PyInstaller desktop-electron/resources/supervisor/supervisor.py --onefile --name supervisor --distpath desktop-electron/resources/supervisor --console --noconfirm --clean
          if (-not (Test-Path "desktop-electron/resources/supervisor/supervisor.exe")) {
            throw "supervisor.exe 未生成"
          }

      - name: 安装打包依赖 (desktop-electron)
        working-directory: desktop-electron
        run: npm ci

      - name: 下载 Redis Windows 二进制 (tporadowski/redis)
        shell: pwsh
        run: |
          $headers = @{ "User-Agent" = "LaomaAI-build" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/tporadowski/redis/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -like "Redis-x64-*.zip" } | Select-Object -First 1
          if (-not $asset) { throw "redis release 无 Redis-x64 zip 资产" }
          $zip = Join-Path $env:RUNNER_TEMP "redis-win.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $zip
          $dest = "desktop-electron/resources/redis"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Expand-Archive -Path $zip -DestinationPath $dest -Force
          Get-ChildItem $dest | Select-Object -ExpandProperty Name

      - name: 准备占位目录 (services)
        run: |
          New-Item -ItemType Directory -Force -Path "dist/services" | Out-Null

      - name: electron-builder 打包 (不发布)
        working-directory: desktop-electron
        run: npx electron-builder --win --x64 --publish never

      - name: 生成 latest.yml (finalize)
        working-directory: desktop-electron
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          node scripts/finalize-windows-release.mjs dist-build "${VERSION}"

      - name: 校验 Windows 产物
        working-directory: desktop-electron
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "验证版本: ${VERSION}"
          node scripts/verify-release-assets.mjs dist-build "${VERSION}"

      - name: 上传安装包校验摘要
        if: always()
        shell: pwsh
        run: |
          echo "### Windows 产物" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem -Path .\desktop-electron\dist-build -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '\.(exe|yml|blockmap)$' } |
            ForEach-Object { "  - $($_.Name)  ($([math]::Round($_.Length / 1MB, 2)) MB)" >> $env:GITHUB_STEP_SUMMARY }

      - name: 上传 Windows 发布资产
        uses: actions/upload-artifact@v4
        with:
          name: prism-win-assets
          path: |
            desktop-electron/dist-build/*.exe
            desktop-electron/dist-build/*.exe.blockmap
            desktop-electron/dist-build/latest.yml
          if-no-files-found: error

  build-macos:
    name: macOS (dmg + zip)
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: macos-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 同步版本号 (与 tag/输入一致)
        shell: bash
        run: |
          if [ -n "${LAOMA_VERSION}" ]; then
            VERSION="${LAOMA_VERSION#v}"
            node -e "const fs=require('fs');const p='desktop-electron/package.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));d.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(d,null,2)+'\n','utf8')"
            echo "✅ version 同步为 ${VERSION}"
          else
            echo "⚠️ 手动触发未填版本，使用 package.json 现有版本"
          fi
          node -p "require('./desktop-electron/package.json').version"

      - name: 解析云端地址 (注入 NEXT_PUBLIC_CLOUD_URL)
        shell: bash
        run: |
          set -euo pipefail
          # 单一真值：desktop-electron/package.json 的 laomaCloudUrl（云端根地址，不含 /cloud 后缀）
          # 与本地打包脚本 scripts/packaging/resolve_cloud_url.ps1 读同一个字段，两边不会漂移。
          CLOUD_URL=$(node -p "require('./desktop-electron/package.json').laomaCloudUrl")
          if [ -z "$CLOUD_URL" ]; then
            echo "::error::desktop-electron/package.json 缺少 laomaCloudUrl，无法构建前端"
            exit 1
          fi
          echo "laomaCloudUrl = ${CLOUD_URL}"
          echo "NEXT_PUBLIC_CLOUD_URL=${CLOUD_URL}" >> "$GITHUB_ENV"

      - name: 构建前端 (Next.js standalone)
        working-directory: prism_frontend
        run: |
          npm ci
          npm run build

      - name: 构建 prismenv (Python 运行时)
        run: |
          python3 -m venv prismenv
          prismenv/bin/python -m pip install --upgrade pip
          prismenv/bin/python -m pip install -r requirements.txt

      - name: 安装打包依赖 (desktop-electron)
        working-directory: desktop-electron
        run: npm ci

      - name: electron-builder 打包 (不发布)
        working-directory: desktop-electron
        run: npx electron-builder --mac --publish never

      - name: 校验 macOS 产物
        working-directory: desktop-electron
        shell: bash
        run: |
          echo "### macOS 产物" >> "$GITHUB_STEP_SUMMARY"
          # macOS 目标: dmg(通用) / zip / latest-mac.yml (+ blockmap)
          for f in dist-build/*.dmg dist-build/*.zip dist-build/*.blockmap dist-build/latest-mac.yml; do
            if [ -f "$f" ]; then
              echo "  - $(basename "$f")  ($(du -h "$f" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: 上传 macOS 发布资产
        uses: actions/upload-artifact@v4
        with:
          name: prism-mac-assets
          path: |
            desktop-electron/dist-build/*.dmg
            desktop-electron/dist-build/*.zip
            desktop-electron/dist-build/*.blockmap
            desktop-electron/dist-build/latest-mac.yml
          if-no-files-found: error

  publish:
    name: 发布 GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: prism-win-assets
          path: .release-assets/win

      - uses: actions/download-artifact@v4
        with:
          name: prism-mac-assets
          path: .release-assets/mac

      - name: 解析版本与 tag
        id: resolve
        shell: bash
        run: |
          VERSION="${LAOMA_VERSION#v}"
          if [ -z "$VERSION" ]; then
            VERSION=$(node -p "require('./desktop-electron/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "发布版本 => $VERSION, tag => v$VERSION"

      - name: 发布版本 Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.resolve.outputs.tag }}
          name: 老马AI工作台 ${{ steps.resolve.outputs.version }}
          prerelease: false
          draft: false
          allowUpdates: true
          removeArtifacts: true
          replacesArtifacts: true
          makeLatest: true
          commit: ${{ github.sha }}
          body: |
            自动发布的桌面版构建。
            版本: `${{ steps.resolve.outputs.version }}`
            标签: `${{ steps.resolve.outputs.tag }}`
            提交: `${{ github.sha }}`
          artifacts: .release-assets/win/*, .release-assets/mac/*
