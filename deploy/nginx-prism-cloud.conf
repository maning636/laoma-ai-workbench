# ============================================================================
# Prism-Fusion Cloud Service — nginx server 片段
# ============================================================================
# 目标服务器:OpenCloudOS 9.6,RHEL 系,nginx 1.29.8
# 落位路径:/etc/nginx/conf.d/prism-cloud.conf  (由运维手工 copy,不由脚本自动放置)
#
# 部署步骤(在目标机器 root shell):
#   sudo cp /opt/prism-fusion/app/deploy/nginx-prism-cloud.conf \
#           /etc/nginx/conf.d/prism-cloud.conf
#   sudo sed -i 's|^server_name .*|server_name fusion.maning789link.top;|' \
#                /etc/nginx/conf.d/prism-cloud.conf
#   sudo sed -i 's|#ssl_certificate .*/etc/letsencrypt|ssl_certificate /etc/letsencrypt|' \
#                /etc/nginx/conf.d/prism-cloud.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# **重要**:不要动 /etc/nginx/conf.d/fde.conf (那是 Pay Skill 项目的
#           server 块,与本片段完全独立)。
#
# 子域名占位:`fusion.maning789link.top` —— 部署时改成实际子域名。
# 证书路径占位:/etc/letsencrypt/live/fusion.maning789link.top/... ——
#              部署时改成实际 certbot 路径或你的 CA 提供商路径。
# ============================================================================

# ─── 上传体积限制 ─────────────────────────────────────────────────
# cloud_service 目前主要接收 JSON 请求体(认证/计费/LLM chat),
# 不接收大文件上传。但为了兜底防御,给整个站点一个 5m 的硬上限。
# 未来如要开放图片/音频上传,再针对具体 location 单独放宽。
client_max_body_size 5m;

# ─── 通用 upstream 参数(SSE 友好) ───────────────────────────────
# 与后端约定:
#   后端绑定 127.0.0.1:8091,systemd unit 拉起
#   uvicorn --host 127.0.0.1 --port 8091
upstream prism_cloud_backend {
    server 127.0.0.1:8091;
    keepalive 16;
}

# ─── HTTP → HTTPS 强制跳转 ───────────────────────────────────────
# 只在本子域名下做跳转;不影响 fde.conf 里的其它 server。
server {
    listen 80;
    listen [::]:80;
    server_name fusion.maning789link.top;   # TODO: 改成实际子域名

    # ACME HTTP-01 challenge (Let's Encrypt / certbot) —— 必须放行
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余全部跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─── HTTPS 主入口 ─────────────────────────────────────────────────
server {
    # nginx >= 1.25.1 已弃用 "listen ... http2" 写法(会打 deprecation warning),
    # 统一改用独立的 http2 指令。当前服务器 nginx 1.29.8 支持。
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fusion.maning789link.top;   # TODO: 改成实际子域名

    # 证书路径占位(部署时改成 certbot 实际输出路径):
    ssl_certificate     /etc/letsencrypt/live/fusion.maning789link.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fusion.maning789link.top/privkey.pem;

    # ── TLS 强约束 ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── HSTS(首次上线建议先去掉注释并观察;若确认无误再打开) ──
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 通用安全头 ──
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "SAMEORIGIN"             always;
    add_header X-XSS-Protection          "0"                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # CSP 故意留空:cloud_service 走的是纯 API 反代,前端静态资源由其它站点托管,
    # 这里强行下发 CSP 反而会误伤。未来如把前端也放到本域下,再单独配。

    # 隐藏 nginx 版本
    server_tokens off;

    # 访问日志(单独一条,方便与 Pay Skill 的日志分开)
    access_log  /var/log/nginx/prism-cloud.access.log;
    error_log   /var/log/nginx/prism-cloud.error.log warn;

    # ── 健康检查(内部探针,不对外) ──
    location = /health {
        proxy_pass http://prism_cloud_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # ── SSE 专用 location —— /cloud/llm/stream ──
    # 关键指令(缺一不可):
    #   1. proxy_buffering off         —— nginx 不缓冲上游响应,数据帧到达立即下发
    #   2. proxy_cache off             —— 双保险
    #   3. proxy_http_version 1.1      —— keepalive 上游用 HTTP/1.1
    #   4. proxy_set_header Connection ""
    #      —— 清空 Connection 头,不然 nginx 1.15+ 会自作主张加 Connection: close
    #   5. proxy_read_timeout 300s     —— SSE 长连接超时时间;
    #      300s 覆盖最长一次 LLM 生成(DeepSeek-V3 一般 <60s);太短会掐断流。
    #   6. proxy_send_timeout 300s     —— 与 read 对齐,防写侧被掐
    #   7. proxy_request_buffering off —— 允许客户端边写边发请求体(与 SSE 无直接关系,
    #      但对大 JSON 请求体也友好;若严格 SSE-only 场景也可打开)
    #   8. add_header X-Accel-Buffering "no" always —— 显式再打一次头,
    #      有些下游代理看 nginx 头而不是后端头
    location = /cloud/llm/stream {
        proxy_pass http://prism_cloud_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering       off;
        proxy_cache           off;
        proxy_request_buffering off;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;

        add_header X-Accel-Buffering "no" always;

        # 允许客户端中途断开(5xx? 客户端主动关流不是错误)
        # nginx 收到上游关闭时不会重试 SSE,这是预期行为。
    }

    # ── 其余 /cloud/* API 走普通反代 ──
    # 保留 SSE 之外的长连接友好参数,但恢复 buffer/timeout 到常规值,
    # 避免给上游造成不必要压力。
    location /cloud/ {
        proxy_pass http://prism_cloud_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # 允许一定大小的上传(与 client_max_body_size 一致,5m)
        client_max_body_size 5m;
    }

    # 其它路径(理论上不应该出现,返回 404 而不是 fallback 到默认 server)
    location / {
        return 404;
    }
}
