<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>老马AI工作台</title>
    <style>
        /* ====== 老马AI工作台 · 新粗野主义 Neo-Brutalism 主题 ====== */
        /* 配色取自参考设计 index.html：米黄底 + 粗黑边框 + 硬阴影 + 亮色点缀 */
        
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        
        :root {
            --sidebar-width: 64px;
            --navbar-height: 58px;
            /* 粗野主义配色 */
            --ink: #0F0F0F;
            --paper: #FFF6E5;
            --pink: #FF5FA2;
            --yellow: #FFD429;
            --blue: #3D7BFF;
            --green: #2FD07A;
            --white: #FFFFFF;
            --mute: #6B6B6B;
            --danger: #FF5FA2;
            --bw: 3px;
            --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: "Sarasa Gothic SC", "JetBrains Mono", Consolas, monospace;
            /* 硬阴影 */
            --shadow-s: 4px 4px 0 var(--ink);
            --shadow-m: 6px 6px 0 var(--ink);
            --shadow-l: 8px 8px 0 var(--ink);
            --shadow-xl: 10px 10px 0 var(--ink);
            --transition: all 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            font-family: var(--sans);
        }
        
        body {
            background: var(--paper);
            color: var(--ink);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            -webkit-font-smoothing: antialiased;
        }
        
        /* ====== 侧边栏 ====== */
        .sidebar {
            width: var(--sidebar-width);
            height: 100%;
            background: var(--white);
            border-right: var(--bw) solid var(--ink);
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 10px 8px 12px;
            gap: 10px;
            z-index: 1000;
            position: relative;
        }
        
        .sidebar-rail {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 0;
        }
        
        .sidebar-top {
            display: flex;
            flex-direction: column;
            align-items: stretch;
        }
        
        .sidebar-utility {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 2px;
        }
        
        /* ====== Tab 按钮 ====== */
        .tab-item,
        .sidebar-action {
            position: relative;
            width: 100%;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            background: var(--white);
            border: var(--bw) solid var(--ink);
            box-shadow: var(--shadow-s);
            overflow: visible;
        }
        
        .sidebar-action {
            height: 44px;
            color: var(--mute);
            appearance: none;
            outline: none;
        }
        
        /* tooltip */
        .tab-item::after,
        .sidebar-action::after {
            content: attr(data-tooltip);
            position: absolute;
            left: calc(100% + 12px);
            top: 50%;
            transform: translateY(-50%) translateX(-6px);
            padding: 8px 14px;
            border-radius: 999px;
            background: var(--ink);
            color: var(--white);
            border: var(--bw) solid var(--ink);
            box-shadow: var(--shadow-s);
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 1100;
        }
        
        .tab-item:hover::after,
        .sidebar-action:hover::after {
            opacity: 1;
            transform: translateY(-50%) translateX(0);
        }
        
        .sidebar-action.menu-open::after {
            opacity: 0;
            transform: translateY(-50%) translateX(-6px);
        }
        
        /* hover / active */
        .tab-item:hover,
        .sidebar-action:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-m);
        }
        
        .tab-item:active,
        .sidebar-action:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        
        .tab-item.active {
            background: var(--yellow);
            box-shadow: var(--shadow-m);
        }
        
        .sidebar-action.active {
            background: var(--yellow);
            box-shadow: var(--shadow-m);
        }
        
        .tab-item.active::before {
            content: '';
            position: absolute;
            left: 5px;
            top: 50%;
            width: 3px;
            height: 16px;
            background: var(--ink);
            border-radius: 999px;
            transform: translateY(-50%);
        }
        
        .tab-item.is-pinned {
            background: var(--blue);
            color: var(--white);
        }
        
        /* tab icon */
        .tab-icon {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        
        .tab-item svg,
        .sidebar-action svg,
        .tab-item .hermes-logo-icon,
        .sidebar-action .hermes-logo-icon {
            width: 18px;
            height: 18px;
            transition: var(--transition);
        }
        
        .tab-item svg,
        .sidebar-action svg {
            color: var(--mute);
        }
        
        .tab-item .hermes-logo-icon,
        .sidebar-action .hermes-logo-icon {
            display: inline-block;
            background-color: currentColor;
            color: var(--mute);
            opacity: 0.9;
            mask: url("./assets/hermes-agent-logo.svg") no-repeat center / contain;
            -webkit-mask: url("./assets/hermes-agent-logo.svg") no-repeat center / contain;
        }
        
        .tab-item.active svg,
        .add-btn svg,
        .settings-btn-primary,
        .sidebar-action.active svg {
            color: var(--ink);
        }
        
        .tab-item.active .hermes-logo-icon,
        .sidebar-action:hover .hermes-logo-icon,
        .sidebar-action.active .hermes-logo-icon {
            color: var(--ink);
            opacity: 1;
        }
        
        /* tab close */
        .tab-close {
            position: absolute;
            top: -4px;
            right: -4px;
            width: 18px;
            height: 18px;
            background: var(--pink);
            border: var(--bw) solid var(--ink);
            border-radius: 999px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            opacity: 0;
            transition: var(--transition);
            color: var(--white);
            box-shadow: 2px 2px 0 var(--ink);
            cursor: pointer;
        }
        
        .tab-item:hover .tab-close {
            opacity: 1;
        }
        
        .tab-close:hover {
            background: var(--ink);
            color: var(--white);
        }
        
        /* add button */
        .add-btn {
            background: var(--green);
        }
        
        /* sidebar action menu (弹出菜单) */
        .sidebar-action-group {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-action-menu {
            position: absolute;
            left: calc(100% + 12px);
            bottom: 50%;
            transform: translateY(50%) translateX(-8px);
            min-width: 224px;
            padding: 10px;
            border-radius: 8px;
            border: var(--bw) solid var(--ink);
            background: var(--white);
            box-shadow: var(--shadow-l);
            display: flex;
            flex-direction: column;
            gap: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.18s ease, transform 0.18s ease;
            z-index: 1200;
        }
        
        .sidebar-action-menu.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(50%) translateX(0);
        }
        
        .sidebar-action-option {
            width: 100%;
            border: var(--bw) solid var(--ink);
            border-radius: 4px;
            background: var(--paper);
            color: var(--ink);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            cursor: pointer;
            transition: var(--transition);
            text-align: left;
            box-shadow: var(--shadow-s);
        }
        
        .sidebar-action-option:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-m);
            background: var(--yellow);
        }
        
        .sidebar-action-option:focus-visible {
            outline: none;
            border-color: var(--ink);
            box-shadow: var(--shadow-m);
        }
        
        .sidebar-action-option-title {
            font-size: 13px;
            font-weight: 900;
            letter-spacing: -0.01em;
        }
        
        .sidebar-action-option-desc {
            font-size: 11px;
            color: var(--mute);
            line-height: 1.4;
        }
        
        /* ====== 主区域 ====== */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            min-width: 0;
        }
        
        /* navbar */
        .navbar {
            height: var(--navbar-height);
            background: var(--white);
            display: flex;
            align-items: center;
            padding: 0 22px;
            gap: 16px;
            border-bottom: var(--bw) solid var(--ink);
        }
        
        .address-bar {
            flex: 1;
            height: 40px;
            background: var(--paper);
            border: var(--bw) solid var(--ink);
            border-radius: 999px;
            display: flex;
            align-items: center;
            padding: 0 18px;
            max-width: 860px;
            margin: 0 auto;
            transition: var(--transition);
            box-shadow: var(--shadow-s);
        }
        
        .address-bar:focus-within {
            box-shadow: var(--shadow-m);
            transform: translate(-1px, -1px);
        }
        
        .address-bar input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            color: var(--ink);
            font-size: 13px;
            font-weight: 500;
            letter-spacing: -0.01em;
            text-align: center;
        }
        
        .address-bar input::placeholder {
            color: var(--mute);
        }
        
        /* webview */
        .webview-container {
            flex: 1;
            background: var(--paper);
            position: relative;
        }
        
        webview {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }
        
        webview.active {
            display: flex;
        }
        
        /* ====== Tab 弹出窗口 ====== */
        .tab-popup {
            position: fixed;
            left: calc(var(--sidebar-width) + 14px);
            width: 320px;
            background: var(--white);
            border: var(--bw) solid var(--ink);
            border-radius: 8px;
            padding: 20px;
            display: none;
            box-shadow: var(--shadow-l);
            z-index: 10000;
            transform-origin: left center;
            animation: popupReveal 0.24s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes popupReveal {
            from { opacity: 0; transform: scale(0.94) translateX(-12px); }
            to { opacity: 1; transform: scale(1) translateX(0); }
        }
        
        .p-title {
            font-size: 14px;
            font-weight: 900;
            color: var(--ink);
            margin-bottom: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 20px;
        }
        
        .p-url-container {
            position: relative;
            margin-bottom: 18px;
            min-height: 40px;
        }
        
        .p-url-display {
            color: var(--mute);
            font-size: 12px;
            padding: 10px 14px;
            border-radius: 4px;
            background: var(--paper);
            border: var(--bw) solid var(--ink);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: text;
            transition: all 0.18s;
        }
        
        .p-url-display:hover {
            background: var(--yellow);
            color: var(--ink);
        }
        
        .p-url-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--white);
            border: var(--bw) solid var(--ink);
            border-radius: 4px;
            color: var(--ink);
            padding: 0 14px;
            font-size: 12px;
            outline: none;
            display: none;
            box-shadow: var(--shadow-s);
            animation: inputScale 0.18s cubic-bezier(0.22, 1, 0.36, 1);
        }
        
        @keyframes inputScale {
            from { transform: scale(0.97); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        
        .p-tools {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-top: 15px;
            border-top: var(--bw) solid var(--ink);
            color: var(--ink);
        }
        
        .p-tool-icon {
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
            border-radius: 4px;
            border: var(--bw) solid transparent;
        }
        
        .p-tool-icon:hover {
            color: var(--blue);
            background: var(--yellow);
            border-color: var(--ink);
            box-shadow: var(--shadow-s);
            transform: translate(-1px, -1px);
        }
        
        .p-tool-icon svg {
            width: 18px;
            height: 18px;
        }
        
        #p-close { color: var(--pink); }
        #p-close:hover { color: var(--white); background: var(--pink); }
        
        /* ====== 设置面板 ====== */
        .settings-panel {
            position: fixed;
            left: calc(var(--sidebar-width) + 10px);
            top: 10px;
            bottom: 10px;
            width: 430px;
            background: var(--white);
            border: var(--bw) solid var(--ink);
            border-radius: 8px;
            z-index: 1000;
            transform: translateX(calc(-100% - 18px));
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
            overflow-y: auto;
            box-shadow: var(--shadow-l);
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        .settings-panel::-webkit-scrollbar { display: none; }
        
        .settings-panel.open { transform: translateX(0); }
        
        .settings-header {
            padding: 24px;
            border-bottom: var(--bw) solid var(--ink);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: var(--white);
            z-index: 10;
        }
        
        .settings-header h2 {
            font-size: 20px;
            font-weight: 900;
            color: var(--ink);
            letter-spacing: -0.02em;
        }
        
        .settings-close {
            min-width: 52px;
            height: 34px;
            padding: 0 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            cursor: pointer;
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            transition: var(--transition);
            background: var(--paper);
            border: var(--bw) solid var(--ink);
            box-shadow: var(--shadow-s);
        }
        
        .settings-close:hover {
            background: var(--pink);
            color: var(--white);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-m);
        }
        
        .settings-content { padding: 20px; }
        
        .settings-section { margin-bottom: 28px; }
        
        .settings-section-title {
            font-size: 12px;
            font-weight: 900;
            color: var(--mute);
            text-transform: uppercase;
            letter-spacing: 0.14em;
            margin-bottom: 12px;
            font-family: var(--mono);
        }
        
        .settings-item {
            background: var(--paper);
            border: var(--bw) solid var(--ink);
            border-radius: 4px;
            padding: 14px 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: var(--transition);
            cursor: pointer;
            box-shadow: var(--shadow-s);
        }
        
        .settings-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--shadow-m);
            background: var(--yellow);
        }
        
        .settings-item-info { flex: 1; }
        
        .settings-item-label {
            font-size: 14px;
            color: var(--ink);
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .settings-item-desc {
            font-size: 12px;
            color: var(--mute);
        }
        
        .settings-item-action { margin-left: 12px; }
        
        .settings-btn-small {
            padding: 8px 16px;
            font-size: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 700;
            border: var(--bw) solid var(--ink);
            box-shadow: var(--shadow-s);
        }
        
        .settings-btn-small:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 var(--ink);
        }
        
        .settings-btn-primary {
            background: var(--green);
            color: var(--ink);
        }
        
        .settings-btn-primary:hover {
            background: var(--yellow);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-m);
        }
        
        .settings-btn-danger {
            background: var(--pink);
            color: var(--white);
        }
        
        .settings-btn-danger:hover {
            background: var(--ink);
            color: var(--white);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-m);
        }
        
        .settings-btn-secondary {
            background: var(--white);
            color: var(--ink);
        }
        
        .settings-btn-secondary:hover {
            background: var(--blue);
            color: var(--white);
            transform: translate(-1px, -1px);
            box-shadow: var(--shadow-m);
        }
        
        .settings-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 15, 15, 0.4);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s ease;
        }
        
        .settings-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
</head>

<body>
    <div class="settings-overlay" id="settings-overlay"></div>

    <div class="settings-panel" id="settings-panel">
        <div class="settings-header">
            <h2>系统设置</h2>
            <div class="settings-close" id="settings-close">关闭</div>
        </div>
        <div class="settings-content">
            <div class="settings-section">
                <div class="settings-section-title">数据清理</div>
                <div class="settings-item" onclick="clearMaterialsData()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">清除素材数据</div>
                        <div class="settings-item-desc">删除所有本地视频素材</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-secondary">清除</button>
                    </div>
                </div>
                <div class="settings-item" onclick="clearAccountsData()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">清除账号 & Cookies</div>
                        <div class="settings-item-desc">删除所有账号登录信息</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-secondary">清除</button>
                    </div>
                </div>
                <div class="settings-item" onclick="clearAllCache()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">清除所有缓存</div>
                        <div class="settings-item-desc">清空临时文件和缓存</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-secondary">清除</button>
                    </div>
                </div>
                <div class="settings-item" onclick="clearVideoData()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">清除视频数据</div>
                        <div class="settings-item-desc">删除所有本地视频与相关数据</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-secondary">清除</button>
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <div class="settings-section-title">紧急操作</div>
                <div class="settings-item" onclick="runSystemCheck()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">运行系统自检</div>
                        <div class="settings-item-desc">检查系统健康状态</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-primary">自检</button>
                    </div>
                </div>
                <div class="settings-item" onclick="exportSystemLogs()">
                    <div class="settings-item-info">
                        <div class="settings-item-label">导出系统日志</div>
                        <div class="settings-item-desc">打包下载所有日志文件</div>
                    </div>
                    <div class="settings-item-action">
                        <button class="settings-btn-small settings-btn-primary">导出</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <div class="sidebar-rail">
            <div class="sidebar-top" id="sidebar-tabs">
                <!-- Tabs will be injected here -->
            </div>
        </div>

        <div class="sidebar-utility">
            <button class="sidebar-action add-btn" id="add-tab" type="button" title="新建会话" data-tooltip="新建会话">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
                    stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="4"></rect>
                    <path d="M12 8.5v7"></path>
                    <path d="M8.5 12h7"></path>
                </svg>
            </button>

            <div class="sidebar-action-group" id="hermes-menu-group">
                <button class="sidebar-action hermes-btn" id="hermes-dashboard-btn" type="button" title="Hermes"
                    data-tooltip="Hermes" aria-haspopup="menu" aria-expanded="false" aria-controls="hermes-entry-menu">
                    <span class="hermes-logo-icon" aria-hidden="true"></span>
                </button>
                <div class="sidebar-action-menu" id="hermes-entry-menu" role="menu" aria-label="Hermes entries">
                    <button class="sidebar-action-option" id="hermes-dashboard-entry" type="button" role="menuitem">
                        <span class="sidebar-action-option-title">HermesAgentDashboard</span>
                        <span class="sidebar-action-option-desc">进入 Dashboard 界面</span>
                    </button>
                    <button class="sidebar-action-option" id="hermes-webui-entry" type="button" role="menuitem">
                        <span class="sidebar-action-option-title">HermesAgentWebUI</span>
                        <span class="sidebar-action-option-desc">进入 WebUI 界面</span>
                    </button>
                </div>
            </div>

            <button class="sidebar-action settings-btn" id="settings-btn" type="button" title="系统设置"
                data-tooltip="系统设置">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M4 7h16"></path>
                    <path d="M4 12h16"></path>
                    <path d="M4 17h16"></path>
                    <circle cx="15" cy="7" r="2"></circle>
                    <circle cx="9" cy="12" r="2"></circle>
                    <circle cx="13" cy="17" r="2"></circle>
                </svg>
            </button>
        </div>
    </div>

    <div class="main-area">
        <div class="navbar">
            <div class="address-bar">
                <input type="text" id="url-bar" spellcheck="false" placeholder="输入网址或搜索内容..." />
            </div>
        </div>
        <div class="webview-container" id="webview-container">
            <!-- Webviews -->
        </div>
    </div>

    <div id="tab-popup" class="tab-popup">
        <div id="p-title" class="p-title">会话加载中...</div>

        <div class="p-url-container" id="p-url-container">
            <div id="p-url-display" class="p-url-display">https://...</div>
            <input type="text" id="p-url-input" class="p-url-input" placeholder="输入并回车访问...">
        </div>

        <div class="p-tools">
            <div class="p-tool-icon" id="p-back" title="后退">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </div>
            <div class="p-tool-icon" id="p-forward" title="前进">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            </div>
            <div class="p-tool-icon" id="p-reload" title="刷新">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15">
                    </path>
                </svg>
            </div>
            <div class="p-tool-icon" id="p-copy" title="复制网址">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
            </div>
            <div style="flex-grow: 1"></div>
            <div class="p-tool-icon" id="p-close" title="关闭标签">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </div>
        </div>
    </div>

    <script src="./renderer.js"></script>
</body>

</html>
